[pytest]
# Register project-specific markers so pytest can validate them in strict-marker mode.
# Keep data- and service-dependent suites opt-in for environments without those resources.
markers =
    requires_data: requires the private governed AML database
    integration: requires dataset/aml.duckdb
    llm: requires GROQ_API_KEY
    e2e: requires a running FastAPI server
    performance: contains timing assertions
